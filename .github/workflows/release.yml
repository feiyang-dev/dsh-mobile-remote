name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Run checks
        run: npm run check

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # 未配置 NPM_TOKEN 时跳过发布（Release 创建不依赖此步骤）
        if: ${{ secrets.NPM_TOKEN != '' }}

      - name: Package tarball for release assets
        run: npm pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: feiyang666-dsh-mobile-remote-*.tgz
          body_path: RELEASE_NOTES.md
